{% extends 'base.html' %}{% block body %}<div class="admin-top"><h1>Inhalte bearbeiten</h1><a class="button outline" href="/">Website ansehen ↗</a><form action="/admin/logout" method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="button outline">Abmelden</button></form></div><p>Änderungen werden nach dem Speichern sofort veröffentlicht.</p><form method="post" class="editor"><input type="hidden" name="csrf_token" value="{{csrf_token()}}">{% for group in fields|groupby('group') %}<fieldset><legend>{{group.grouper}}</legend>{% for f in group.list %}<label>{{f.label}}<textarea name="{{f.key}}" rows="{{3 if c[f.key]|length > 100 else 2}}" required maxlength="2000">{{c[f.key]}}</textarea></label>{% endfor %}</fieldset>{% endfor %}<button class="button primary save">Änderungen speichern</button></form><details class="password-panel"><summary>Admin-Passwort ändern</summary><form action="/admin/password" method="post" class="editor"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Aktuelles Passwort<input type="password" name="current_password" autocomplete="current-password" required></label><label>Neues Passwort (mindestens 16 Zeichen)<input type="password" name="new_password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label>Neues Passwort wiederholen<input type="password" name="confirm_password" minlength="16" maxlength="256" autocomplete="new-password" required></label><button class="button outline">Passwort ändern</button></form></details>{% endblock %}
